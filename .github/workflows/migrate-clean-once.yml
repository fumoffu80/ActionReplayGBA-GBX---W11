name: Migrate sanitized repository once

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace working tree with sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/actionreplaygbx-sanitized
          rm -rf "$SRC"
          git clone --depth 1 --branch main https://github.com/fumoffu80/ActionReplayGBX---W11.git "$SRC"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' "$SRC"/ ./

          git config user.name 'fumoffu80'
          git config user.email '16899713+fumoffu80@users.noreply.github.com'
          git add -A
          git commit -m 'chore: import sanitized ActionReplayGBX v1.2.31.4 tree'
          git push origin HEAD:main

      - name: Import sanitized historical tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add sanitized-source https://github.com/fumoffu80/ActionReplayGBX---W11.git
          for tag in v1.1.3 v1.2.9 v1.2.10 v1.2.11 v1.2.12 v1.2.13 v1.2.14 v1.2.15 v1.2.16; do
            git fetch sanitized-source "refs/tags/$tag:refs/tags/$tag"
            git push origin "refs/tags/$tag:refs/tags/$tag"
          done
          git tag -f v1.2.31.4 HEAD
          git push --force origin refs/tags/v1.2.31.4

      - name: Copy GitHub Releases and assets
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REPO: fumoffu80/ActionReplayGBX---W11
          NEW_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tags=(v1.1.3 v1.2.9 v1.2.10 v1.2.11 v1.2.12 v1.2.13 v1.2.14 v1.2.15 v1.2.16 v1.2.31.4)
          for tag in "${tags[@]}"; do
            echo "Migrating release $tag"
            work="/tmp/release-$tag"
            rm -rf "$work" && mkdir -p "$work/assets"
            gh release view "$tag" --repo "$OLD_REPO" --json name,body,isDraft,isPrerelease > "$work/meta.json"
            jq -r '.body // ""' "$work/meta.json" > "$work/body.md"
            name=$(jq -r '.name // "'"$tag"'"' "$work/meta.json")
            prerelease=$(jq -r '.isPrerelease' "$work/meta.json")
            gh release download "$tag" --repo "$OLD_REPO" --dir "$work/assets" || true

            if gh release view "$tag" --repo "$NEW_REPO" >/dev/null 2>&1; then
              echo "Release $tag already exists; skipping create"
            else
              args=(release create "$tag" --repo "$NEW_REPO" --title "$name" --notes-file "$work/body.md" --verify-tag)
              if [ "$prerelease" = "true" ]; then args+=(--prerelease); fi
              files=("$work"/assets/*)
              if [ -e "${files[0]}" ]; then
                gh "${args[@]}" "${files[@]}"
              else
                gh "${args[@]}"
              fi
            fi
          done
