name: Fix migrated repository links once

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README repository links
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#https://github.com/fumoffu80/ActionReplayGBX---W11#https://github.com/fumoffu80/ActionReplayGBA-GBX---W11#g' README.md
          sed -i 's#https://github.com/fumoffu80/ActionReplayGBA---W11#https://github.com/fumoffu80/ActionReplayGBA-GBX---W11#g' README.md
          git config user.name 'fumoffu80'
          git config user.email '16899713+fumoffu80@users.noreply.github.com'
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m 'docs: fix migrated repository links'
            git push origin HEAD:main
          fi

      - name: Update links in migrated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tags=(v1.1.3 v1.2.9 v1.2.10 v1.2.11 v1.2.12 v1.2.13 v1.2.14 v1.2.15 v1.2.16 v1.2.31.4)
          for tag in "${tags[@]}"; do
            body="/tmp/body-$tag.md"
            gh release view "$tag" --repo "$REPO" --json body --jq '.body // ""' > "$body"
            sed -i 's#https://github.com/fumoffu80/ActionReplayGBX---W11#https://github.com/fumoffu80/ActionReplayGBA-GBX---W11#g' "$body"
            sed -i 's#https://github.com/fumoffu80/ActionReplayGBA---W11#https://github.com/fumoffu80/ActionReplayGBA-GBX---W11#g' "$body"
            gh release edit "$tag" --repo "$REPO" --notes-file "$body"
          done
